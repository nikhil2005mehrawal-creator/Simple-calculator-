<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #141e30, transparent 45%),
                #0b1020;
            padding: 20px;
        }

        /* Calculator Box */
        .calculator {
            width: 360px;
            padding: 22px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        /* Heading */
        .title {
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }

        .title span {
            color: #00e5ff;
        }

        /* Display */
        .display {
            width: 100%;
            height: 100px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: rgba(0, 0, 0, 0.35);
            color: white;
            text-align: right;
            padding: 15px 18px;
            font-size: 38px;
            font-weight: 500;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.3);
        }

        /* Buttons Grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 18px;
            font-size: 22px;
            font-weight: 600;
            color: white;
            background: rgba(255, 255, 255, 0.09);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25),
                inset 0 1px rgba(255, 255, 255, 0.08);
        }

        /* Hover Effect */
        button:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 20px rgba(0, 229, 255, 0.15);
        }

        /* Click Effect */
        button:active {
            transform: scale(0.92);
        }

        /* Clear Button */
        .clear {
            color: #ff5c7a;
            background: rgba(255, 92, 122, 0.12);
        }

        .clear:hover {
            background: rgba(255, 92, 122, 0.25);
        }

        /* Delete Button */
        .delete {
            color: #ffc857;
        }

        /* Operators */
        .operator {
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.10);
        }

        .operator:hover {
            background: rgba(0, 229, 255, 0.25);
        }

        /* Equal Button */
        .equals {
            grid-column: span 2;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
        }

        .equals:hover {
            background: linear-gradient(135deg, #00e5ff, #0066ff);
            box-shadow: 0 8px 25px rgba(0, 160, 255, 0.4);
        }

        /* Zero Button */
        .zero {
            grid-column: span 2;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
            margin-top: 18px;
        }

        /* Mobile Responsive */
        @media (max-width: 400px) {
            .calculator {
                width: 100%;
                max-width: 350px;
                padding: 18px;
            }

            button {
                height: 60px;
            }

            .display {
                height: 90px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">
            ✨ <span>Smart</span> Calculator
        </div>

        <!-- Display -->
        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >

        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- First Row -->
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="delete" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="addOperator('%')">%</button>
            <button class="operator" onclick="addOperator('/')">÷</button>

            <!-- Second Row -->
            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addOperator('*')">×</button>

            <!-- Third Row -->
            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addOperator('-')">−</button>

            <!-- Fourth Row -->
            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addOperator('+')">+</button>

            <!-- Fifth Row -->
            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addDecimal()">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

        <div class="footer">
            HTML • CSS • JavaScript
        </div>

    </div>


    <script>

        // Get display
        const display = document.getElementById("display");

        // Add number
        function addNumber(number) {

            if (display.value === "0" || display.value === "Error") {
                display.value = number;
            } else {
                display.value += number;
            }
        }


        // Add operator
        function addOperator(operator) {

            if (display.value === "Error") {
                display.value = "0";
            }

            let lastCharacter =
                display.value.charAt(display.value.length - 1);

            // Prevent multiple operators
            if ("+-*/%".includes(lastCharacter)) {
                display.value =
                    display.value.slice(0, -1) + operator;
            } else {
                display.value += operator;
            }
        }


        // Add decimal
        function addDecimal() {

            let expression = display.value;

            // Get last number
            let parts = expression.split(/[\+\-\*\/\%]/);
            let lastNumber = parts[parts.length - 1];

            // Don't allow two decimal points
            if (!lastNumber.includes(".")) {

                if (
                    expression === "0" ||
                    " +-*/%".includes(
                        expression.charAt(expression.length - 1)
                    )
                ) {
                    display.value += "0.";
                } else {
                    display.value += ".";
                }
            }
        }


        // Clear display
        function clearDisplay() {
            display.value = "0";
        }


        // Delete last character
        function deleteLast() {

            if (
                display.value === "Error" ||
                display.value.length === 1
            ) {
                display.value = "0";
            } else {
                display.value = display.value.slice(0, -1);
            }
        }


        // Calculate result
        function calculate() {

            try {

                let expression = display.value;

                // Don't calculate if expression ends with operator
                if ("+-*/%".includes(
                    expression.charAt(expression.length - 1)
                )) {
                    expression = expression.slice(0, -1);
                }

                // Security: only allow calculator characters
                if (!/^[0-9+\-*/%.() ]+$/.test(expression)) {
                    display.value = "Error";
                    return;
                }

                let result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (!isFinite(result)) {
                    display.value = "Error";
                    return;
                }

                // Remove unnecessary decimal digits
                result = Number(result.toFixed(10));

                display.value = result;

            } catch (error) {

                display.value = "Error";

            }
        }


        // Keyboard Support
        document.addEventListener("keydown", function(event) {

            const key = event.key;

            // Numbers
            if (key >= "0" && key <= "9") {
                addNumber(key);
            }

            // Operators
            else if (["+", "-", "*", "/", "%"].includes(key)) {
                addOperator(key);
            }

            // Decimal
            else if (key === ".") {
                addDecimal();
            }

            // Enter / =
            else if (key === "Enter" || key === "=") {
                calculate();
            }

            // Backspace
            else if (key === "Backspace") {
                deleteLast();
            }

            // Escape = Clear
            else if (key === "Escape") {
                clearDisplay();
            }

        });

    </script>

</body>
</html>
